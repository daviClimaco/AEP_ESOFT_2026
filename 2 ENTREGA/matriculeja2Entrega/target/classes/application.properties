spring.application.name=MatriculeJa
server.port=8080

# H2 — banco de dados embutido (arquivo em disco, persiste entre reinicializações)
spring.datasource.url=jdbc:h2:file:./matriculeja-db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Console H2 (acessível em http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
